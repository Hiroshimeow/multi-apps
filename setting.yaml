# ============================================
# GLOBAL SETTINGS  
# ============================================
# * `log`: Cấu hình log hệ thống.
#   * `dir`: Thư mục chứa log (mặc định: "./logs" tương đối với thư mục launcher).
#   * `rotate_days`: Số ngày giữ log.
global:
  default_conda_env: "ana11"
  session:
    type: "subprocess"
  log:
    dir: "./logs"
    rotate_days: 7

  multi_run: false
  interactive: true

# ============================================
# APPS
# ============================================
apps:
  - name: "Screens-trans-chatbot"
    type: "uv"
    path: "E:/python_project/Screens-Trans-Chatbot/main.py"
    workdir: "E:/python_project/Screens-Trans-Chatbot"
    enabled: true
    os: win11
    auto_start: false
    multi_run: true

  - name: "Auto Suggest"
    type: "python"
    path: "E:/python_project/auto-suggest/main.py"
    env: null
    args: null
    enabled: false
    os: win11

  - name: "Copy-Content"
    type: "python"
    path: "E:/python_project/multi-run-apps/tools/copy-content/copy-content.py"
    auto_start: true
    enabled: true
    multi_run: false
    os: win11

  - name: "Advance Clipboard"
    type: "python"
